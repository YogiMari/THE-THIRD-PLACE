name: THE THIRD PLACE — Mirror to Google Drive

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = 確認のみ"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mirror-to-drive
  cancel-in-progress: false

env:
  DRIVE_FOLDER_ID: 1qNdwj6g8ikCbNtS827hWNAhmqQ00xDDG

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Write rclone config
        env:
          CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          [ -n "$CONF" ] || { echo "RCLONE_CONFIG missing" >&2; exit 1; }
          mkdir -p ~/.config/rclone
          printf '%s\n' "$CONF" > ~/.config/rclone/rclone.conf
      - name: Sync
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS+=(--dry-run)
          fi
          rclone sync . gdrive: \
            --drive-root-folder-id "$DRIVE_FOLDER_ID" \
            --exclude ".git/**" --exclude ".github/**" \
            -v "${FLAGS[@]}"
