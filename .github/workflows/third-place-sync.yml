name: THE THIRD PLACE — SSOT Sync Validation

on:
  push:
    branches: [main]
    paths:
      - "DS/**"
      - "OP/**"
      - "DB/**"
      - "MD/**"
      - "BR/**"
      - "CZ/**"
      - "KN/**"
      - "scripts/**"
      - ".github/workflows/**"

  pull_request:
    paths:
      - "DS/**"
      - "OP/**"
      - "DB/**"
      - "MD/**"
      - "BR/**"
      - "CZ/**"
      - "KN/**"
      - "scripts/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ssot:
    name: Validate SSOT Synchronization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the MD-004 integrity check compares with the base commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate official documents
        shell: bash
        run: |
          set -euo pipefail

          find_file() {
            local id="$1"
            local result
            result="$(find DS OP DB MD BR CZ KN -type f \( -iname "*${id}*" -o -iname "${id}.md" \) | head -n 1 || true)"

            if [ -z "$result" ]; then
              echo "ERROR: Could not locate $id" >&2
              exit 2
            fi

            printf '%s' "$result"
          }

          # MD-004 is split by domain (OP-008 §11.2): pass the folder, not one file.
          if [ ! -d MD/MD-004 ] || ! ls MD/MD-004/MD-004_*.md >/dev/null 2>&1; then
            echo "ERROR: Could not locate MD/MD-004" >&2
            exit 2
          fi
          echo "MD004=MD/MD-004" >> "$GITHUB_ENV"
          echo "BR002=$(find_file BR-002)" >> "$GITHUB_ENV"
          echo "BR003=$(find_file BR-003)" >> "$GITHUB_ENV"
          echo "CZ001=$(find_file CZ-001)" >> "$GITHUB_ENV"
          echo "CZ002=$(find_file CZ-002)" >> "$GITHUB_ENV"
          echo "MD001=$(find_file MD-001)" >> "$GITHUB_ENV"

      - name: Validate SSOT consistency
        run: |
          python scripts/third_place_sync_validator.py \
            --md004 "$MD004" \
            --br002 "$BR002" \
            --br003 "$BR003" \
            --cz001 "$CZ001" \
            --cz002 "$CZ002" \
            --md001 "$MD001"

      - name: Check document catalogue (OP-008 §8 against files and headers)
        run: python scripts/doc_catalogue_check.py

      - name: MD-004 by Status (job summary only; not committed)
        if: always()
        run: python scripts/doc_catalogue_check.py --status-list >> "$GITHUB_STEP_SUMMARY"

      - name: Check Field Atlas consistency (MD-002, DB-001, MD-004, map data, pages)
        run: python scripts/field_atlas_check.py

      - name: Check MD-004 integrity (records, parent/child, Version on change)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Base commit to compare with: a pull request's base, or the previous
          # tip of main on push. Without one (manual run, first push), only the
          # structure checks run.
          BASE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] \
            && [ -n "$PUSH_BEFORE" ] \
            && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            BASE="$PUSH_BEFORE"
          fi

          if [ -n "$BASE" ]; then
            python scripts/md004_integrity_check.py --md004 "$MD004" --base-ref "$BASE"
          else
            echo "::notice::No base commit; running the structure checks only."
            python scripts/md004_integrity_check.py --md004 "$MD004"
          fi
