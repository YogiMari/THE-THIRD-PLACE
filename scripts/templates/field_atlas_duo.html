<title>Field Atlas</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  /* Field Atlas: the host of the two editions. The page data is held once; the edition in view runs in a frame
     built from its own template, and the title in either edition swaps it (scripts/field_atlas_duo.py). */
  :root{--night:#010409;--day:#FAF9F5}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--night)}
  body.aubade{background:var(--day)}
  .fa-f{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}
  .fa-f.next{clip-path:circle(0px at var(--x) var(--y));pointer-events:none}
  .fa-f.next.go{clip-path:circle(var(--r) at var(--x) var(--y));transition:clip-path 1.05s cubic-bezier(.76,0,.24,1)}
  .fa-wait{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;pointer-events:none;z-index:5;
    border:1.5px solid var(--c);box-shadow:0 0 18px var(--c);animation:fa-wait 1.1s cubic-bezier(.2,.8,.2,1) infinite}
  @keyframes fa-wait{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
  /* the edge of the reveal: a ring in the next edition's accent that grows with the circle, then fades */
  .fa-ring{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:6;transform:translate(-50%,-50%) scale(0);
    border:1.5px solid var(--c);box-shadow:0 0 22px 2px var(--c),inset 0 0 22px 2px var(--c);opacity:.95}
  .fa-ring.go{transform:translate(-50%,-50%) scale(1);opacity:0;transition:transform 1.05s cubic-bezier(.76,0,.24,1),opacity .5s .7s ease}
  @media (prefers-reduced-motion: reduce){.fa-wait{animation:none;opacity:.7}}
</style>
<script type="application/json" id="fa-data">/*__PIECES__*/{}</script>
<script>
(()=>{
const PIECES=document.getElementById("fa-data").textContent;
const SKINS=/*__SKINS__*/{};
const PAGE_URL="__PAGE_URL__";
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ORDER=Object.keys(SKINS);
let cur=ORDER[0],frame=null,busy=false;
try{const s=localStorage.getItem("fa-skin1");if(SKINS[s])cur=s;}catch(e){}
let init=null;
try{const m=location.hash.match(/f=(\d+)/);if(m)init={a:+m[1]};}catch(e){}
// the frame's document: doctype, the page data and the edition's flags, then the edition's own template
function srcdoc(k,switched,sel){
  const other=ORDER[(ORDER.indexOf(k)+1)%ORDER.length];
  const flags={skin:k,other:SKINS[other].name,url:PAGE_URL};
  return '<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'+
    "<script>window.FA_D="+PIECES+";window.FA_DUO="+JSON.stringify(flags)+";window.FA_INIT="+JSON.stringify(sel)+";window.FA_SWITCH="+(switched?"true":"false")+"<\/script>"+
    SKINS[k].html;
}
function make(k,switched,sel){
  const f=document.createElement("iframe");f.className="fa-f";f.title="Field Atlas "+SKINS[k].name;
  f.setAttribute("allow","clipboard-write");f.srcdoc=srcdoc(k,switched,sel);return f;
}
function settle(k){
  cur=k;document.body.className=k;document.title="Field Atlas · "+SKINS[k].name;
  try{localStorage.setItem("fa-skin1",k);}catch(e){}
}
function swap(m){
  if(busy)return;busy=true;
  const k=ORDER[(ORDER.indexOf(cur)+1)%ORDER.length],old=frame,f=make(k,true,{a:m.a,b:m.b});
  const done=()=>{if(frame===f)return;clearTimeout(guard);if(wait)wait.remove();if(old)old.remove();f.classList.remove("next","go");frame=f;settle(k);busy=false;try{f.focus();}catch(e){}};
  let wait=null,guard=0;
  if(RM){f.style.visibility="hidden";document.body.appendChild(f);f.addEventListener("load",()=>{f.style.visibility="";done();},{once:true});guard=setTimeout(()=>{f.style.visibility="";done();},8000);return;}
  const x=+m.x||innerWidth/2,y=+m.y||40,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y))+40;
  wait=document.createElement("div");wait.className="fa-wait";wait.style.cssText=`left:${x}px;top:${y}px;--c:${SKINS[k].accent}`;document.body.appendChild(wait);
  f.classList.add("next");f.style.setProperty("--x",x+"px");f.style.setProperty("--y",y+"px");f.style.setProperty("--r",r+"px");
  document.body.appendChild(f);
  const ring=document.createElement("div");ring.className="fa-ring";ring.style.cssText=`left:${x}px;top:${y}px;width:${2*r}px;height:${2*r}px;--c:${SKINS[k].accent}`;
  f.addEventListener("load",()=>{setTimeout(()=>{if(wait)wait.style.opacity="0";document.body.appendChild(ring);ring.getBoundingClientRect();
    requestAnimationFrame(()=>{f.classList.add("go");ring.classList.add("go");});setTimeout(()=>ring.remove(),1400);},140);},{once:true});
  f.addEventListener("transitionend",e=>{if(e.propertyName==="clip-path")done();});
  guard=setTimeout(done,9000);
}
addEventListener("message",e=>{
  const m=e.data;if(!m||typeof m!=="object"||![...document.querySelectorAll("iframe.fa-f")].some(f=>f.contentWindow===e.source))return;
  if(m.fa==="hash"&&Number.isInteger(m.f)){try{history.replaceState(null,"","#f="+m.f);}catch(_){}}
  else if(m.fa==="skin"&&e.source===(frame&&frame.contentWindow))swap({a:Number.isInteger(m.a)?m.a:null,b:Number.isInteger(m.b)?m.b:null,x:m.x,y:m.y});
});
const start=()=>{frame=make(cur,false,init);settle(cur);document.body.appendChild(frame);};
if(document.body)start();else addEventListener("DOMContentLoaded",start);
})();
</script>
